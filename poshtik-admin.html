<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; form-action 'self'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">

<title>Franchise Enquiry Desk — The Poshtik Kitchen</title>
<meta name="theme-color" content="#0a0a08">

<link rel="icon" type="image/png" sizes="32x32" href="assets/poshtik/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/poshtik/icon-192.png">
<link rel="apple-touch-icon" href="assets/poshtik/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="poshtik-admin.css?v=20261117b">
<script src="poshtik-admin.js?v=20261117b" defer></script>
</head>
<body data-endpoint="https://script.google.com/macros/s/AKfycbx6ycnxuw4jg7knb2OthcCzR5kk3jRSdYPsUnQKLcTFJ9gq31VLHVwg5J6SXKtAzQM/exec">

<section class="lock" id="lock">
  <div class="lock__card">
    <img class="lock__logo" src="assets/poshtik/logo-480.webp" width="112" height="112" alt="Poshtik Kitchen">
    <h1>Franchise Enquiry Desk</h1>
    <p class="lock__sub">The Poshtik Kitchen · Admin</p>
    <form id="lockForm">
      <label for="pw">Password</label>
      <input class="input" id="pw" type="password" autocomplete="current-password" required>
      <button class="btn btn--full" id="openBtn" type="submit">Open desk</button>
      <p class="msg" id="lockMsg" role="alert"></p>
    </form>
  </div>
</section>

<main class="desk" id="desk" hidden>
  <header class="top">
    <div class="brand">
      <img src="assets/poshtik/logo-480.webp" width="44" height="44" alt="">
      <div>
        <h1>Franchise Enquiry Desk</h1>
        <p>The Poshtik Kitchen</p>
      </div>
    </div>
    <nav class="tools" aria-label="Desk">
      <span class="updated" id="updated"></span>
      <button class="text-btn" id="refreshBtn" type="button">Refresh</button>
      <button class="text-btn" id="lockBtn" type="button">Lock</button>
    </nav>
  </header>

  <section class="summary" aria-label="Summary">
    <p><span class="figure" id="sTotal">0</span><span class="label">enquiries</span></p>
    <p><span class="figure" id="sWeek">0</span><span class="label">this week</span></p>
    <p><span class="figure" id="sToday">0</span><span class="label">today</span></p>
  </section>

  <section class="enquiries" aria-labelledby="listTitle">
    <div class="enquiries__head">
      <h2 id="listTitle">Enquiries <span class="count" id="count"></span></h2>
      <input class="input search" id="q" type="search" placeholder="Search name, number or location" aria-label="Search enquiries">
    </div>
    <ul class="list" id="rows"></ul>
    <p class="none" id="empty" hidden>No enquiries yet.</p>
  </section>
</main>

</body>
</html>
